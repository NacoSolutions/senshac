name: Nightly PageSpeed & Lighthouse Audit

on:
  schedule:
    - cron: "30 0 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Use fixture responses and skip issue mutations
        required: false
        default: false
        type: boolean

jobs:
  audit:
    name: Run PageSpeed Insights
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      WIP_SITE_URL: ${{ vars.WIP_SITE_URL || 'https://wip.senshac.com' }}
      RESULTS_FILE: /tmp/pagespeed-results-${{ github.run_id }}.jsonl
      KNOWN_FAILURE_FILE: /tmp/pagespeed-known-failure-${{ github.run_id }}
      DRY_RUN: ${{ inputs.dry_run || false }}
      PERFORMANCE_TARGET: 95
      QUALITY_TARGET: 100
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Bun
        if: env.ACT != 'true'
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: 1.3.13

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Fetch Lighthouse scores
        id: audit
        run: |
          set -euo pipefail

          create_issue_once() {
            local title="$1"
            local labels="$2"
            local body="$3"
            local existing
            if [ "$DRY_RUN" = "true" ]; then
              echo "Dry run: would report issue '$title' with labels '$labels'"
              return
            fi
            existing=$(
              gh issue list --state open --limit 100 --json number,title |
                jq -r --arg title "$title" \
                  '.[] | select(.title == $title) | .number' |
                head -n 1
            )
            if [ -n "$existing" ]; then
              gh issue comment "$existing" --body "$body"
            else
              gh issue create --title "$title" --label "$labels" --body "$body"
            fi
          }

          mapfile -t URLS < <(
            bun run scripts/pagespeed-routes.ts \
              --base="$WIP_SITE_URL" \
              --lang=es
          )
          if [ "${#URLS[@]}" -eq 0 ]; then
            echo "Generated route contract contains no PageSpeed routes." >&2
            exit 1
          fi

          : > "$RESULTS_FILE"
          KNOWN_FAILURE=false
          STRATEGIES=("mobile" "desktop")

          for URL in "${URLS[@]}"; do
            for STRATEGY in "${STRATEGIES[@]}"; do
              echo "Running Lighthouse for $URL on $STRATEGY..."
              CURL_ARGS=(
                --fail-with-body
                --silent
                --show-error
                --retry 3
                --get
                "https://www.googleapis.com/pagespeedonline/v5/runPagespeed"
                --data-urlencode "url=${URL}"
                --data-urlencode "strategy=${STRATEGY}"
                --data-urlencode "category=performance"
                --data-urlencode "category=accessibility"
                --data-urlencode "category=best-practices"
                --data-urlencode "category=seo"
              )
              if [ -n "${{ secrets.PAGESPEED_API_KEY }}" ]; then
                CURL_ARGS+=(--data-urlencode "key=${{ secrets.PAGESPEED_API_KEY }}")
              fi

              RESPONSE_FILE=$(mktemp)
              if [ "$DRY_RUN" = "true" ]; then
                printf '%s' \
                  '{"lighthouseResult":{"categories":{"performance":{"score":0.95},"accessibility":{"score":1},"best-practices":{"score":0.96},"seo":{"score":1}}}}' \
                  > "$RESPONSE_FILE"
              elif ! curl "${CURL_ARGS[@]}" --output "$RESPONSE_FILE"; then
                echo "PageSpeed request failed for $URL ($STRATEGY)" >&2
              fi

              if ! SCORES=$(bun run scripts/pagespeed-result.ts < "$RESPONSE_FILE"); then
                ERROR_MSG=$(
                  jq -r '.error.message // "Incomplete PageSpeed response"' \
                    "$RESPONSE_FILE" 2>/dev/null ||
                    printf '%s' "PageSpeed returned an unreadable response"
                )
                TITLE="PageSpeed API Failure for $URL ($STRATEGY)"
                printf -v BODY '%s\n\n%s' \
                  "The nightly PageSpeed audit failed for $URL ($STRATEGY): $ERROR_MSG" \
                  "[View run log]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)"
                create_issue_once "$TITLE" "type/bug,priority/P1,area/build" "$BODY"
                KNOWN_FAILURE=true
                rm -f "$RESPONSE_FILE"
                continue
              fi
              rm -f "$RESPONSE_FILE"

              IFS=$'\t' read -r PERFORMANCE ACCESSIBILITY BEST_PRACTICES SEO <<< "$SCORES"
              jq -cn \
                --arg url "$URL" \
                --arg strategy "$STRATEGY" \
                --argjson performance "$PERFORMANCE" \
                --argjson accessibility "$ACCESSIBILITY" \
                --argjson bestPractices "$BEST_PRACTICES" \
                --argjson seo "$SEO" \
                '{
                  url: $url,
                  strategy: $strategy,
                  performance: $performance,
                  accessibility: $accessibility,
                  bestPractices: $bestPractices,
                  seo: $seo
                }' >> "$RESULTS_FILE"

              echo "::notice title=Lighthouse Scores for $URL ($STRATEGY)::Performance: ${PERFORMANCE} | Accessibility: ${ACCESSIBILITY} | Best Practices: ${BEST_PRACTICES} | SEO: ${SEO}"

              if ! THRESHOLD_REPORT=$(
                bun run scripts/pagespeed-threshold.ts \
                  --url "$URL" \
                  --strategy "$STRATEGY" \
                  --target "$PERFORMANCE_TARGET" \
                  --quality-target "$QUALITY_TARGET" \
                  "$PERFORMANCE" \
                  "$ACCESSIBILITY" \
                  "$BEST_PRACTICES" \
                  "$SEO"
              ); then
                TITLE="Lighthouse target missed for $URL ($STRATEGY)"
                printf -v BODY '%s\n\n%s' \
                  "$THRESHOLD_REPORT" \
                  "[View run log]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)"
                create_issue_once "$TITLE" "type/bug,priority/P1,area/build" "$BODY"
                KNOWN_FAILURE=true
              fi
            done
          done

          if [ "$KNOWN_FAILURE" = true ]; then
            touch "$KNOWN_FAILURE_FILE"
            exit 1
          fi

      - name: Upload PageSpeed results
        if: always() && env.ACT != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: pagespeed-results-${{ github.run_id }}
          path: ${{ env.RESULTS_FILE }}
          if-no-files-found: warn
          retention-days: 30

      - name: Report unexpected workflow failure
        if: failure() && inputs.dry_run != true
        run: |
          set -euo pipefail
          if [ -f "$KNOWN_FAILURE_FILE" ]; then
            exit 0
          fi

          TITLE="PageSpeed Nightly Workflow Failed"
          printf -v BODY '%s\n\n%s' \
            "The nightly PageSpeed audit encountered an unexpected failure." \
            "[View run log]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)"
          EXISTING=$(
            gh issue list --state open --limit 100 --json number,title |
              jq -r --arg title "$TITLE" \
                '.[] | select(.title == $title) | .number' |
              head -n 1
          )
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "$BODY"
          else
            gh issue create \
              --title "$TITLE" \
              --label "type/bug,priority/P1,area/build" \
              --body "$BODY"
          fi
