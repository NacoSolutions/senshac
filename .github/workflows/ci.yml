name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/nacosolutions/senshac-ci-runner:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: read
      packages: read
    steps:
      - name: Prepare runner environment
        run: |
          mkdir -p /usr/bin
          ln -sf "$(command -v env)" /usr/bin/env
          cert_file=""
          for candidate in /nix/store/*/etc/ssl/certs/ca-bundle.crt; do
            if [ -f "$candidate" ]; then
              cert_file="$candidate"
              break
            fi
          done
          if [ -n "$cert_file" ]; then
            {
              echo "SSL_CERT_FILE=$cert_file"
              echo "NIX_SSL_CERT_FILE=$cert_file"
              echo "NODE_EXTRA_CA_CERTS=$cert_file"
            } >> "$GITHUB_ENV"
          fi

      - name: Checkout
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git init "$GITHUB_WORKSPACE"
          cd "$GITHUB_WORKSPACE"
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          git -c http.extraheader="AUTHORIZATION: bearer $GITHUB_TOKEN" fetch --depth=1 origin "$GITHUB_REF"
          git checkout --detach FETCH_HEAD

      - run: bun install --frozen-lockfile
      - run: bun run verify:ci

      - name: Test timing summary
        if: always()
        run: bun run report:test-timing

      - name: Code-quality metrics summary
        if: always()
        run: bun run report:quality-metrics
