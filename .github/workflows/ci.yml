name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: 1.3.13

      - run: bun install --frozen-lockfile
      - name: Install Betterleaks
        run: |
          workdir=$(mktemp -d)
          cd "$workdir"
          archive=betterleaks_1.4.0_linux_x64.tar.gz
          curl -fsSLO "https://github.com/betterleaks/betterleaks/releases/download/v1.4.0/$archive"
          echo "e2cb2b909baf64f48abaf2487c1a5874751196bd9d715e4fd68f7f94b0fbf601  $archive" | sha256sum --check
          tar -xzf "$archive"
          mkdir -p "$HOME/.local/bin"
          install -m 0755 betterleaks "$HOME/.local/bin/betterleaks"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: bun run build
      - name: Restore committed Tina build outputs
        run: |
          git restore -- \
            public/admin/index.html \
            tina/__generated__/client.ts \
            tina/__generated__/types.js \
            tina/__generated__/types.ts
          rm -rf tina/__generated__/.cache
      - run: bun run acceptance --skip-build
      - run: bun run check:clean
      - run: bun run check:all
      - name: Verify no unexpected generated drift
        run: |
          git restore -- coverage/lcov.info coverage/summary.json
          git diff --exit-code
      - run: bun test
      - run: bun run check:clean

      - name: Test timing summary
        if: always()
        run: bun run report:test-timing

      - name: Code-quality metrics summary
        if: always()
        run: bun run report:quality-metrics

      - name: Upload test timing artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bun-test-timing
          path: .timing.json
          if-no-files-found: ignore
