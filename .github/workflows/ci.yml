name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/nacosolutions/senshac-ci-runner:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: read
      packages: read
    steps:
      - name: Prepare POSIX shims
        run: |
          mkdir -p /usr/bin
          ln -sf "$(command -v env)" /usr/bin/env
          for node_version in node20 node24; do
            mkdir -p "/__e/$node_version/bin"
            ln -sf "$(command -v node)" "/__e/$node_version/bin/node"
          done
          cert_file=""
          for candidate in /nix/store/*/etc/ssl/certs/ca-bundle.crt; do
            if [ -f "$candidate" ]; then
              cert_file="$candidate"
              break
            fi
          done
          if [ -n "$cert_file" ]; then
            {
              echo "SSL_CERT_FILE=$cert_file"
              echo "NIX_SSL_CERT_FILE=$cert_file"
              echo "NODE_EXTRA_CA_CERTS=$cert_file"
            } >> "$GITHUB_ENV"
          fi

      - uses: actions/checkout@v4

      - run: bun install --frozen-lockfile
      - run: bun run verify:ci

      - name: Test timing summary
        if: always()
        run: bun run report:test-timing

      - name: Code-quality metrics summary
        if: always()
        run: bun run report:quality-metrics

      - name: Upload test timing artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bun-test-timing
          path: .timing.json
          if-no-files-found: ignore
