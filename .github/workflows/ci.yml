name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: 1.3.13

      - run: bun install --frozen-lockfile
      - run: bun run build
      - name: Restore committed Tina build outputs
        run: |
          git restore -- \
            public/admin/index.html \
            tina/__generated__/client.ts \
            tina/__generated__/types.js \
            tina/__generated__/types.ts
          rm -rf tina/__generated__/.cache
      - run: bun run check:all
      - name: Verify no unexpected generated drift
        run: |
          git restore -- coverage/lcov.info coverage/summary.json
          git diff --exit-code
      - run: bun test
      - run: bun run acceptance --skip-build

      - name: Test timing summary
        if: always()
        run: bun run report:test-timing

      - name: Code-quality metrics summary
        if: always()
        run: bun run report:quality-metrics

      - name: Upload test timing artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bun-test-timing
          path: .timing.json
          if-no-files-found: ignore
