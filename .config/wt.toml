[[pre-start]]
secrets = """
for file in .env.local .env.pages .secrets.act; do
  test -f "{{ repo_path }}/../$file"
done
"""
direnv = "direnv allow ."
hooks = "git config core.hooksPath .githooks"

[[pre-start]]
dependencies = "direnv exec . bun install --frozen-lockfile"

[[pre-merge]]
verify = "direnv exec . bun run check:precommit"
